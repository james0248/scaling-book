defaults:
  - model: ???
  - _self_

seed: 42
batch_size: 256
total_flops: ???
total_steps: ${eval:'int(${total_flops} // (${model.flops_per_token} * (4 * ${data.max_digits} + 2) * ${batch_size}))'}

data:
  max_digits: 6
  num_samples: null

optimizer:
  _target_: optax.adamw
  learning_rate:
    _target_: optax.cosine_decay_schedule
    init_value: ${model.learning_rate}
    decay_steps: ${total_steps}
    alpha: 0.1

hydra:
  mode: MULTIRUN
  sweep:
    dir: outputs/approach_2_moe
    subdir: ${hydra.runtime.choices.model}_${total_steps}
