defaults:
  - model: moe_20k
  - _self_

seed: 42
batch_size: 256
total_steps: ???

data:
  max_digits: 6
  num_samples: null

optimizer:
  _target_: optax.adamw
  learning_rate:
    _target_: optax.cosine_decay_schedule
    init_value: ${model.learning_rate}
    decay_steps: ${total_steps}
    alpha: 0.1

hydra:
  mode: MULTIRUN
  sweep:
    dir: outputs/approach_1_moe
    subdir: ${hydra.runtime.choices.model}_${total_steps}
  sweeper:
    params:
      model: moe_20k,moe_29k,moe_35k,moe_39k,moe_51k,moe_68k,moe_80k,moe_85k,moe_106k,moe_114k,moe_132k,moe_152k,moe_158k,moe_189k,moe_206k,moe_227k,moe_257k,moe_302k,moe_334k,moe_359k,moe_401k,moe_422k,moe_461k,moe_506k,moe_534k,moe_590k,moe_624k,moe_667k,moe_727k,moe_831k,moe_879k,moe_926k,moe_1_00m,moe_1_13m,moe_1_19m,moe_1_25m,moe_1_34m,moe_1_42m,moe_1_49m,moe_1_57m,moe_1_75m,moe_1_86m,moe_2_03m,moe_2_12m,moe_2_23m,moe_2_38m,moe_2_56m,moe_2_79m,moe_2_97m,moe_3_17m
