defaults:
  - model: moe_20k
  - _self_

seed: 42
batch_size: 256
total_steps: ???

data:
  max_digits: 6
  num_samples: null

optimizer:
  _target_: optax.adamw
  learning_rate:
    _target_: optax.cosine_decay_schedule
    init_value: ${model.learning_rate}
    decay_steps: ${total_steps}
    alpha: 0.1

hydra:
  mode: MULTIRUN
  sweep:
    dir: outputs/approach_1_moe
    subdir: ${hydra.runtime.choices.model}_${total_steps}
  sweeper:
    params:
      # 1-in-4 subsample of the dense family: keep every 4th model by size
      # (index 0, 4, 8, ...). Trades resolution for wall-clock — MoE runs are
      # noticeably slower per model than dense due to ragged_dot overhead.
      model: moe_20k,moe_51k,moe_106k,moe_158k,moe_257k,moe_401k,moe_534k,moe_727k,moe_1_00m,moe_1_34m,moe_1_75m,moe_2_23m,moe_2_97m
      total_steps: 4000,8000,16000,32000
