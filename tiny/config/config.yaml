defaults:
  - model: 5k
  - _self_

seed: 42
batch_size: 256
total_steps: 1000

model:
  config:
    pos_embed: rope
    use_qk_norm: true

data:
  max_digits: 6
  num_samples: null

optimizer:
  _target_: optax.adamw
  learning_rate:
    _target_: optax.cosine_decay_schedule
    init_value: ${model.learning_rate}
    decay_steps: ${total_steps}
    alpha: 0.1
